<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <!-- Ribbon Gradients -->
    <linearGradient id="hTopRibbon" x1="15" y1="10" x2="65" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38f9d7" />
      <stop offset="40%" stop-color="#00d7d0" />
      <stop offset="100%" stop-color="#0083b0" />
    </linearGradient>

    <linearGradient id="hMidRibbon" x1="15" y1="25" x2="60" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <linearGradient id="hBotRibbon" x1="15" y1="40" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#03045e" />
    </linearGradient>

    <linearGradient id="hOrangeGlow" x1="45" y1="32" x2="60" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffea00" />
      <stop offset="40%" stop-color="#ff9e1b" />
      <stop offset="100%" stop-color="#ff5400" />
    </linearGradient>

    <linearGradient id="hXCyan" x1="225" y1="20" x2="250" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <linearGradient id="hXOrange" x1="235" y1="32" x2="250" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffea00" />
      <stop offset="40%" stop-color="#ff9e1b" />
      <stop offset="100%" stop-color="#ff5400" />
    </linearGradient>

    <linearGradient id="hLineLeft" x1="90" y1="56" x2="160" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="hLineRight" x1="200" y1="56" x2="270" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Geometric Symbol on Left -->
  <g transform="translate(4, 5) scale(0.12)">
    <!-- Left Vertical Spine -->
    <path d="M170 170 L200 150 L200 350 L170 330 Z" fill="#00e5ff" opacity="0.95" />
    <!-- Top Ribbon -->
    <path d="M170 170 L240 120 L275 145 L225 180 L200 165 Z" fill="url(#hTopRibbon)" />
    <path d="M240 120 L275 145 L320 180 L285 200 Z" fill="url(#hTopRibbon)" />
    <path d="M295 180 L355 140 L370 148 L320 230 L285 200 Z" fill="url(#hTopRibbon)" />
    <!-- Middle Arm -->
    <path d="M170 240 L260 175 L285 195 L200 255 Z" fill="url(#hMidRibbon)" />
    <path d="M260 175 L310 215 L290 230 L245 195 Z" fill="url(#hMidRibbon)" />
    <!-- Bottom Ribbon -->
    <path d="M170 330 L200 350 L300 290 L300 260 L200 320 Z" fill="url(#hBotRibbon)" />
    <path d="M285 240 L320 215 L370 325 L340 330 Z" fill="url(#hBotRibbon)" />
    <path d="M200 320 L320 240 L350 265 L225 350 Z" fill="url(#hBotRibbon)" />
    <!-- Amber Glow -->
    <path d="M290 230 L325 210 L345 250 L310 270 Z" fill="url(#hOrangeGlow)" filter="url(#hGlow)" />
    <ellipse cx="320" cy="240" rx="16" ry="8" transform="rotate(-25 320 240)" fill="#ffea00" filter="url(#hGlow)" />
    <circle cx="322" cy="238" r="5" fill="#ffffff" />
  </g>

  <!-- 2. Typography: ECONVY + Stylized X -->
  <g transform="translate(68, 8)">
    <text
      x="0"
      y="33"
      fill="#ffffff"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="2"
    >ECONVY</text>

    <!-- Stylized X -->
    <!-- Backslash \ in Cyan -->
    <path d="M142 12 L152 12 L172 35 L162 35 Z" fill="url(#hXCyan)" filter="url(#hGlow)" />
    <!-- Forward slash / top in Cyan -->
    <path d="M162 12 L172 12 L158 27 L152 21 Z" fill="url(#hXCyan)" filter="url(#hGlow)" />
    <!-- Forward slash / bottom in Orange -->
    <path d="M152 21 L158 27 L147 35 L142 35 Z" fill="url(#hXOrange)" filter="url(#hGlow)" />

    <!-- 3. Subtitle: — AI — -->
    <g transform="translate(0, 15)">
      <line x1="8" y1="30" x2="68" y2="30" stroke="url(#hLineLeft)" stroke-width="1.5" />
      <text
        x="98"
        y="34"
        text-anchor="middle"
        fill="#00f0ff"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="5"
        filter="url(#hGlow)"
      >AI</text>
      <line x1="128" y1="30" x2="188" y2="30" stroke="url(#hLineRight)" stroke-width="1.5" />
    </g>
  </g>
</svg>

